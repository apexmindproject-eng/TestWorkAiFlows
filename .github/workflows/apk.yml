name: Android APK
on:
  push:
    paths: ["Fly in a Box/android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fly in a Box/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages (the runner image has the SDK; accept licences, add the platform and build tools)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FlyInABox.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FlyInABox-apk
          path: FlyInABox.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Fly in a Box — Android app
          body: "Install FlyInABox.apk on the phone, start `python flybox.py --live 8765` on the computer, enter its address in the app."
          files: FlyInABox.apk
          prerelease: true
