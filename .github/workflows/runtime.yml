name: Phone runtime
on:
  push:
    paths: ["Fly in a Box/phone/build_runtime.sh", "Fly in a Box/phone/run_relocated.sh", "Fly in a Box/phone/flyboot.c", "Fly in a Box/phone/seccomp_jail.c", ".github/workflows/runtime.yml", "Fly in a Box/*.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Which CPython build (python-build-standalone, latest release, this architecture)
        id: pbs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCH=$(uname -m)
          gh api repos/astral-sh/python-build-standalone/releases/latest --jq '.tag_name, (.assets | length)'
          gh api --paginate "repos/astral-sh/python-build-standalone/releases/latest" --jq '.assets[].browser_download_url' > urls.txt || true
          TAG=$(gh api repos/astral-sh/python-build-standalone/releases/latest --jq .tag_name)
          RID=$(gh api repos/astral-sh/python-build-standalone/releases/latest --jq .id)
          gh api --paginate "repos/astral-sh/python-build-standalone/releases/$RID/assets?per_page=100" --jq '.[].browser_download_url' >> urls.txt || true
          echo "assets seen: $(wc -l < urls.txt)"; grep -E "${ARCH}-unknown-linux-gnu-install_only\.tar\.gz$" urls.txt | head -20
          URL=$(grep -E "cpython-3\.12\.[0-9]+(\+|%2B)[0-9]+-${ARCH}-unknown-linux-gnu-install_only\.tar\.gz$" urls.txt | head -1)
          [ -n "$URL" ] || URL=$(grep -E "cpython-3\.1[1-3]\.[0-9]+(\+|%2B)[0-9]+-${ARCH}-unknown-linux-gnu-install_only\.tar\.gz$" urls.txt | sort | tail -1)
          echo "python: $URL"; test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Build the runtime in a plain Ubuntu container and export it
        run: |
          docker create --name flyrt -e PBS_URL="${{ steps.pbs.outputs.url }}" -v "$PWD:/src:ro" ubuntu:20.04 bash /src/"Fly in a Box"/phone/build_runtime.sh /src
          docker start -a flyrt
          docker export flyrt | xz -6 -T0 > fly-runtime-${{ matrix.arch }}.tar.xz
          docker rm flyrt
          ls -la fly-runtime-${{ matrix.arch }}.tar.xz
      - name: Test it relocated, through the loader, like the app does
        run: |
          mkdir -p "$HOME/rt" && tar -xJf fly-runtime-${{ matrix.arch }}.tar.xz -C "$HOME/rt" --exclude=dev/* --exclude=proc/* --exclude=sys/*
          set -o pipefail
          echo "== what the loader sees (auxv) and the page size, through flyboot"
          LD_SHOW_AUXV=1 bash "Fly in a Box/phone/run_relocated.sh" "$HOME/rt" --python -c "import os; print('os.sysconf page size', os.sysconf('SC_PAGE_SIZE'))" 2>&1 | grep -E "AT_(PAGESZ|PHDR|PHNUM|ENTRY|BASE|RANDOM|SYSINFO_EHDR|EXECFN|HWCAP)|page size|rror" || true
          bash "Fly in a Box/phone/run_relocated.sh" "$HOME/rt" --python -c "import ctypes; l = ctypes.CDLL(None); print('getpagesize', l.getpagesize(), 'sysconf(30)', l.sysconf(30)); import llvmlite.binding; print('llvmlite imports')" 2>&1 | tail -3 || true
          echo "== two LLVMs in one process (numba's and the software renderer's): both import orders, with a compile"
          bash "Fly in a Box/phone/run_relocated.sh" "$HOME/rt" --python -c "import numba, mujoco; from numba import njit; print('numba first:', njit(lambda x: x + 1)(1))" 2>&1 | tail -2 || true
          bash "Fly in a Box/phone/run_relocated.sh" "$HOME/rt" --python -c "import mujoco, numba; from numba import njit; print('mujoco first:', njit(lambda x: x + 1)(1))" 2>&1 | tail -2 || true
          echo "== the simulation, a third of a second"
          bash "Fly in a Box/phone/run_relocated.sh" "$HOME/rt" --seconds 0.3 --phone --out out/reloc 2>&1 | tail -8
      - name: Test it under a seccomp filter like Android's (the old system calls answered with SIGSYS)
        run: |
          set -o pipefail
          gcc -O2 -static -o "$HOME/seccomp_jail" "Fly in a Box/phone/seccomp_jail.c"
          FLY_WRAP="$HOME/seccomp_jail" bash "Fly in a Box/phone/run_relocated.sh" "$HOME/rt" --seconds 0.3 --phone --out out/jail 2>&1 | tail -12
      - name: Manifest
        run: |
          sha256sum fly-runtime-${{ matrix.arch }}.tar.xz | cut -d" " -f1 > sha.txt
          printf '{"arch":"%s","file":"fly-runtime-%s.tar.xz","sha256":"%s","bytes":%s,"commit":"%s"}\n' "${{ matrix.arch }}" "${{ matrix.arch }}" "$(cat sha.txt)" "$(stat -c %s fly-runtime-${{ matrix.arch }}.tar.xz)" "$GITHUB_SHA" > fly-runtime-${{ matrix.arch }}.json
          cat fly-runtime-${{ matrix.arch }}.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          prerelease: true
          files: |
            fly-runtime-${{ matrix.arch }}.tar.xz
            fly-runtime-${{ matrix.arch }}.json
